name: Lint Pelican Content and Workflows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-rst:
    name: Lint reStructuredText Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Docutils
        run: |
          python -m pip install --upgrade pip
          pip install docutils

      - name: Validate rst Files
        run: |
          find content -name "*.rst" -print0 | while IFS= read -r -d '' file; do
            echo "Linting $file..."
            python -m docutils.core --halt=warning "$file" /dev/null
          done

  lint-workflows:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2